<title>YETI Flight Checklists</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1a1d23;--sub:#6b7280;--line:#e3e5e9;--accent:#2563eb;--pass:#16a34a;--fail:#dc2626;--warn:#b45309;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1e2127;--text:#eef0f3;--sub:#9aa1ab;--line:#2c3037}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1e2127;--text:#eef0f3;--sub:#9aa1ab;--line:#2c3037}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 90px}
.topbar{position:sticky;top:0;padding-top:max(28px, calc(10px + env(safe-area-inset-top,0px)));background:var(--bg);z-index:5;display:flex;align-items:center;justify-content:space-between;padding-bottom:12px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:17px;margin:0}
.badge{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.badge.on{color:var(--pass);border-color:var(--pass)}
.badge.off{color:var(--warn);border-color:var(--warn)}
.home-grid{display:grid;gap:14px;margin-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer;transition:.15s}
.card:active{transform:scale(.98)}
.card h2{margin:0 0 4px;font-size:17px}
.card p{margin:0;color:var(--sub);font-size:13px}
.card .meta{margin-top:10px;font-size:12px;color:var(--sub)}
.btn{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:15px 20px;font-size:16px;font-weight:600;cursor:pointer;min-height:48px}
.btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.hidden{display:none!important}
.progress{height:5px;background:var(--line);border-radius:3px;margin:14px 0;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.section-title{font-size:19px;margin:6px 0 2px}
.section-sub{color:var(--sub);font-size:13px;margin-bottom:14px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--sub);margin-bottom:6px}
.field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea{width:100%;padding:14px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;min-height:48px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.item .grp{font-size:12px;color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.item .txt{font-size:16px;margin:2px 0 10px;line-height:1.4}
.item .info{font-size:12px;color:var(--sub);margin-bottom:10px;line-height:1.6}
.pf{display:flex;gap:10px;margin-bottom:10px}
.pf button{flex:1;padding:16px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;font-weight:600;min-height:52px}
.pf button.sel-pass{background:var(--pass);color:#fff;border-color:var(--pass)}
.pf button.sel-fail{background:var(--fail);color:#fff;border-color:var(--fail)}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.mini input{padding:13px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;min-height:46px}
.remarks{width:100%;padding:13px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;min-height:46px}
.navrow{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;max-width:820px;margin:0 auto}
.navrow .spacer{flex:1}
.summary-row{display:flex;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;font-size:15px}
.summary-row b.fail{color:var(--fail)}
.summary-row b.pass{color:var(--pass)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1}
select.dec{width:100%;padding:14px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:16px;font-weight:600;min-height:48px}
select.dec.go{color:var(--pass)}
select.dec.nogo{color:var(--fail)}
.sigwrap{margin-bottom:10px}
.sigwrap label{display:block;font-size:12px;color:var(--sub);margin-bottom:5px}
.sigpad{width:100%;height:100px;border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none;display:block}
.sigrow{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.sigrow span{font-size:11px;color:var(--sub)}
.sigclear{background:none;border:1px solid var(--line);border-radius:6px;color:var(--accent);font-size:13px;cursor:pointer;padding:6px 12px;min-height:34px}
.photowrap{margin-top:4px}
.photogrid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.photocell{position:relative;width:92px;height:92px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.photocell img{width:100%;height:100%;object-fit:cover;display:block}
.photodel{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:14px;line-height:1;cursor:pointer}
.photobtn{position:relative;display:inline-block;overflow:hidden;text-align:center;width:100%}
.photobtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pdf-preview-card{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;}
.pdf-preview-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;}
.pdf-preview-title{font-size:14px;font-weight:700;}
.pdf-preview-name{font-size:11px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pdf-frame{display:block;width:100%;height:520px;border:1px solid var(--line);border-radius:10px;background:#fff;}
.pdf-preview-open{display:block;text-align:center;margin-top:8px;color:var(--accent);font-size:12px;text-decoration:none;}
.drive-share-btn{width:100%;margin-top:12px;}
.share-note{color:var(--sub);font-size:12px;line-height:1.45;margin:8px 0 0;}
.sigpad{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}

</style>
</head>

function resizeImageFile(file,maxDim,quality){
  return new Promise((res,rej)=>{
    const img=new Image();const url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>=h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}
      else if(h>w&&h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',quality));
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('load failed'));};
    img.src=url;
  });
}
function mountPhotoPicker(container,initial,onChange){
  const wrap=document.createElement('div');wrap.className='photowrap';
  wrap.innerHTML=`<div class="photogrid"></div>
    <label class="btn secondary photobtn">📷 Add Photo<input type="file" accept="image/*" class="photoinput"></label>`;
  container.appendChild(wrap);
  let photos=(initial||[]).slice();
  const grid=wrap.querySelector('.photogrid');
  function renderGrid(){
    grid.innerHTML='';
    photos.forEach((src,i)=>{
      const cell=document.createElement('div');cell.className='photocell';
      cell.innerHTML=`<img src="${src}"><button type="button" class="photodel">×</button>`;
      cell.querySelector('.photodel').onclick=()=>{photos.splice(i,1);renderGrid();onChange(photos);};
      grid.appendChild(cell);
    });
  }
  renderGrid();
  wrap.querySelector('.photoinput').onchange=async e=>{
    const file=e.target.files[0];if(!file)return;
    try{const dataUrl=await resizeImageFile(file,1000,0.72);photos.push(dataUrl);renderGrid();onChange(photos);}
    catch(err){toast('Could not add that photo');}
    e.target.value='';
  };
}
function mountSigPad(container,label,initialDataUrl,onChange){
  const wrap=document.createElement('div');wrap.className='sigwrap';
  wrap.innerHTML=`<label>${label}</label><canvas class="sigpad"></canvas><div class="sigrow"><span>Draw with finger / mouse</span><button type="button" class="sigclear">Clear</button></div>`;
  container.appendChild(wrap);
  const canvas=wrap.querySelector('canvas');
  const ratio=window.devicePixelRatio||1;
  const cssW=Math.max(300,Math.round(canvas.getBoundingClientRect().width||canvas.clientWidth||300));
  const cssH=100;
  canvas.width=Math.round(cssW*ratio);canvas.height=Math.round(cssH*ratio);
  canvas.style.width='100%';canvas.style.height=cssH+'px';
  const ctx=canvas.getContext('2d');ctx.scale(ratio,ratio);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cssW,cssH);
  ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';
  let drawing=false,hasInk=!!initialDataUrl;
  if(initialDataUrl){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,cssW,cssH);img.src=initialDataUrl;}
  function pos(e){
    const r=canvas.getBoundingClientRect();
    const scaleX=(canvas.width/ratio)/r.width;
    const scaleY=(canvas.height/ratio)/r.height;
    return [(e.clientX-r.left)*scaleX,(e.clientY-r.top)*scaleY];
  }
  function down(e){
    e.preventDefault();
    drawing=true;hasInk=true;const [x,y]=pos(e);
    ctx.beginPath();ctx.moveTo(x,y);
    if(canvas.setPointerCapture)canvas.setPointerCapture(e.pointerId);
  }
  function move(e){
    if(!drawing)return;
    e.preventDefault();
    const [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke();
  }
  function up(e){
    if(!drawing)return;
    if(e&&e.preventDefault)e.preventDefault();
    drawing=false;onChange(hasInk?canvas.toDataURL('image/png'):null);
  }
  canvas.addEventListener('pointerdown',down,{passive:false});
  canvas.addEventListener('pointermove',move,{passive:false});
  canvas.addEventListener('pointerup',up,{passive:false});
  canvas.addEventListener('pointercancel',up,{passive:false});
  canvas.addEventListener('lostpointercapture',()=>{if(drawing)up();});
  wrap.querySelector('.sigclear').onclick=()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,cssW,cssH);hasInk=false;onChange(null);};
}

/* ---------- BUILD STEPS ---------- */
function buildSteps(){
  steps=[];
  if(cur==='gng'){
    steps.push({title:'Flight Details',sub:'Basic trial information',type:'header',fields:GNG_HEADER});
    GNG.forEach(([cat,rows])=>steps.push({title:cat,sub:'GO / NO-GO assessment',type:'gng',cat,rows}));
  }else{
    steps.push({title:'Flight Details',sub:'Basic UAV / trial information',type:'header',fields:DLY_HEADER});
    DLY.forEach(([sec,items])=>steps.push({title:sec,sub:items.length+' item(s)',type:'dly',sec,items}));
  }
  steps.push({title:'Review',type:'review'});
}

const LAST_KEY='yeti_last_values';
function loadLastValues(){try{return JSON.parse(localStorage.getItem(LAST_KEY)||'{}');}catch(e){return {};}}
function saveLastValues(){try{
  const keep=(({uavId,uavWeight,flightPlace})=>({uavId,uavWeight,flightPlace}))(data);
  localStorage.setItem(LAST_KEY,JSON.stringify(keep));
}catch(e){}}

function start(id){
  cur=id;data=loadDraft(id);stepIdx=0;buildSteps();
  const isNew=Object.keys(data).length===0;
  if(isNew){
    const last=loadLastValues();
    if(last.uavId)data.uavId=last.uavId;
    if(last.uavWeight)data.uavWeight=last.uavWeight;
    if(last.flightPlace)data.flightPlace=last.flightPlace;
    data.flightDate=new Date().toISOString().slice(0,10);
  }
  document.getElementById('home').classList.add('hidden');
  document.getElementById('topTitle').textContent=cur==='gng'?'GO / NO-GO Matrix':'Daily Airworthiness';
  document.getElementById('navrow').classList.remove('hidden');
  renderStep();
}

function goHome(){saveDraft();saveLastValues();renderHome();}

function renderStep(){
  const s=steps[stepIdx];
  document.getElementById('progFill').style.width=((stepIdx)/(steps.length-1)*100)+'%';
  if(s.type==='review'){
    document.getElementById('wizard').classList.add('hidden');
    document.getElementById('review').classList.remove('hidden');
    renderReview();
    document.getElementById('btnNext').textContent='Share PDF';
    document.getElementById('btnNext').onclick=generatePdf;
    document.getElementById('btnBack').disabled=false;
    return;
  }
  document.getElementById('review').classList.add('hidden');
  document.getElementById('wizard').classList.remove('hidden');
  document.getElementById('stepTitle').textContent=s.title;
  document.getElementById('stepSub').textContent=s.sub||'';
  const body=document.getElementById('stepBody');body.innerHTML='';
  if(s.type==='header'){
    s.fields.forEach(([key,label])=>{
      const f=document.createElement('div');f.className='field';
      const type=key==='flightDate'?'date':'text';
      f.innerHTML=`<label>${label}</label><input type="${type}" value="${data[key]||''}" data-k="${key}">`;
      f.querySelector('input').oninput=e=>{data[key]=e.target.value;};
      body.appendChild(f);
    });
  }else if(s.type==='gng'){
    s.rows.forEach(([param,go,nogo,resp])=>{
      const k='gng_'+s.cat+'_'+param;
      const d=data[k]||{};
      const it=document.createElement('div');it.className='item';
      it.innerHTML=`<div class="txt"><b>${param}</b></div>
        <div class="info">GO: ${go}<br>NO-GO: ${nogo}<br>Responsible: ${resp}</div>
        <select class="dec ${d.decision==='GO'?'go':d.decision==='NO-GO'?'nogo':''}">
          <option value="">— Decision —</option>
          <option value="GO" ${d.decision==='GO'?'selected':''}>GO</option>
          <option value="NO-GO" ${d.decision==='NO-GO'?'selected':''}>NO-GO</option>
        </select>
        <div class="field" style="margin-top:8px">
          <input type="text" placeholder="Name" value="${d.name||''}" data-f="name">
        </div>`;
      const sel=it.querySelector('select');
      sel.onchange=e=>{d.decision=e.target.value;data[k]=d;sel.className='dec '+(d.decision==='GO'?'go':d.decision==='NO-GO'?'nogo':'');};
      it.querySelectorAll('[data-f]').forEach(inp=>inp.oninput=e=>{d[e.target.dataset.f]=e.target.value;data[k]=d;});
      mountSigPad(it,'Sign',d.sign||null,val=>{d.sign=val;data[k]=d;});
      body.appendChild(it);
    });
  }else if(s.type==='dly'){
    s.items.forEach(item=>{
      const k='dly_'+item.sl;
      const d=data[k]||{};
      const it=document.createElement('div');it.className='item';
      if(item.type==='photo'){
        it.innerHTML=`<div class="txt">#${item.sl} — ${item.text}</div>`;
        mountPhotoPicker(it,d.photos||[],val=>{d.photos=val;data[k]=d;});
        body.appendChild(it);
        return;
      }
      let html=item.group?`<div class="grp">${item.group}</div>`:'';
      html+=`<div class="txt">#${item.sl} — ${item.text}</div>`;
      if(!item.footer){
        html+=`<div class="pf"><button data-v="pass" class="${d.result==='pass'?'sel-pass':''}">✓ Pass</button><button data-v="fail" class="${d.result==='fail'?'sel-fail':''}">✕ Fail</button></div>`;
      }
      const textExtras=(item.extra||[]).filter(x=>x[2]!=='sig');
      const sigExtras=(item.extra||[]).filter(x=>x[2]==='sig');
      if(textExtras.length){
        html+='<div class="mini">'+textExtras.map(([k2,lbl])=>`<input type="number" inputmode="decimal" step="0.1" placeholder="${lbl}" value="${d[k2]||''}" data-x="${k2}">`).join('')+'</div>';
      }
      html+=`<textarea class="remarks" rows="1" placeholder="Remarks">${d.remarks||''}</textarea>`;
      it.innerHTML=html;
      if(!item.footer){
        it.querySelectorAll('.pf button').forEach(btn=>btn.onclick=()=>{
          d.result=d.result===btn.dataset.v?null:btn.dataset.v;data[k]=d;
          it.querySelectorAll('.pf button').forEach(b=>b.className='');
          if(d.result)it.querySelector(`.pf button[data-v="${d.result}"]`).className=d.result==='pass'?'sel-pass':'sel-fail';
        });
      }
      if(textExtras.length)it.querySelectorAll('[data-x]').forEach(inp=>inp.oninput=e=>{d[e.target.dataset.x]=e.target.value;data[k]=d;});
      it.querySelector('.remarks').oninput=e=>{d.remarks=e.target.value;data[k]=d;};
      sigExtras.forEach(([k2,lbl])=>mountSigPad(it,lbl,d[k2]||null,val=>{d[k2]=val;data[k]=d;}));
      body.appendChild(it);
    });
  }
  document.getElementById('btnBack').disabled=stepIdx===0;
  document.getElementById('btnNext').textContent='Next';
  document.getElementById('btnNext').onclick=next;
}

function next(){if(stepIdx<steps.length-1){saveDraft();stepIdx++;renderStep();window.scrollTo(0,0);}}
function back(){if(stepIdx>0){stepIdx--;renderStep();window.scrollTo(0,0);}else goHome();}
document.getElementById('btnNext').onclick=next;
document.getElementById('btnBack').onclick=back;
document.getElementById('btnHome').onclick=goHome;

/* ---------- REVIEW ---------- */
let currentPdfBlob=null,currentPdfName='',currentPdfUrl=null;

function prepareCurrentPdf(){
  const built=buildPdf();
  currentPdfBlob=built.blob;
  currentPdfName=built.fname;
  if(currentPdfUrl)URL.revokeObjectURL(currentPdfUrl);
  currentPdfUrl=URL.createObjectURL(currentPdfBlob);
  return built;
}

function renderReview(){
  const el=document.getElementById('reviewBody');
  if(cur==='gng'){
    const total=GNG.reduce((a,c)=>a+c[1].length,0);
    let go=0,nogo=0,blank=0;
    GNG.forEach(([cat,rows])=>rows.forEach(([p])=>{const d=data['gng_'+cat+'_'+p]||{};if(d.decision==='GO')go++;else if(d.decision==='NO-GO')nogo++;else blank++;}));
    el.innerHTML=`<div class="summary-row"><span>Total items</span><b>${total}</b></div>
      <div class="summary-row"><span>GO</span><b class="pass">${go}</b></div>
      <div class="summary-row"><span>NO-GO</span><b class="fail">${nogo}</b></div>
      <div class="summary-row"><span>Not yet decided</span><b>${blank}</b></div>`;
  }else{
    const all=DLY.flatMap(s=>s[1]).filter(it=>!it.footer);
    let pass=0,fail=0,blank=0;
    all.forEach(it=>{const d=data['dly_'+it.sl]||{};if(d.result==='pass')pass++;else if(d.result==='fail')fail++;else blank++;});
    el.innerHTML=`<div class="summary-row"><span>Total items</span><b>${all.length}</b></div>
      <div class="summary-row"><span>Pass</span><b class="pass">${pass}</b></div>
      <div class="summary-row"><span>Fail</span><b class="fail">${fail}</b></div>
      <div class="summary-row"><span>Not checked</span><b>${blank}</b></div>`;
  }

  try{
    const built=prepareCurrentPdf();
    el.innerHTML+=`<div class="pdf-preview-card">
      <div class="pdf-preview-head">
        <div class="pdf-preview-title">PDF Preview</div>
        <div class="pdf-preview-name">${built.fname}</div>
      </div>
      <iframe class="pdf-frame" src="${currentPdfUrl}" title="Generated PDF preview"></iframe>
      <a class="pdf-preview-open" href="${currentPdfUrl}" target="_blank" rel="noopener">Open full PDF preview</a>
    </div>
    <p class="share-note">On iPad/iPhone or Android, the button below opens the device share sheet. Choose Google Drive / Save to Drive there.</p>
    <button class="btn drive-share-btn" id="btnDrive">Save to Google Drive</button>`;
    document.getElementById('btnDrive').onclick=sharePdfToDrive;
  }catch(e){
    currentPdfBlob=null;currentPdfName='';
    el.innerHTML+=`<p style="color:var(--fail);font-size:12px;margin-top:10px">Could not prepare the PDF preview. You can still try generating the PDF below.</p>`;
  }
}

  doc.text('Doc No: '+docNo,86,44);
  doc.setDrawColor(BRAND_GREEN[0],BRAND_GREEN[1],BRAND_GREEN[2]);doc.setLineWidth(1.2);
  doc.line(40,54,555,54);
  doc.setTextColor(0,0,0);
}
function checklistBox(doc,data,cell){
  if(!(data.section==='body'&&(data.column.index===cell.pass||data.column.index===cell.fail)))return;
  const raw=data.cell.raw;if(!raw||typeof raw!=='object')return;
  const size=7;
  const cx=data.cell.x+data.cell.width/2-size/2;
  const cy=data.cell.y+data.cell.height/2-size/2;
  doc.setDrawColor(140,140,140);doc.setLineWidth(0.6);
  doc.rect(cx,cy,size,size);
  if(raw.checked){
    const col=data.column.index===cell.pass?[22,163,74]:[220,38,38];
    doc.setFillColor(col[0],col[1],col[2]);doc.rect(cx,cy,size,size,'F');
  }
}
function buildPdf(){
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'pt',format:'a4'});
  let fname;
  const slug=s=>(s||'UAV').split(' ').join('_');
  if(cur==='gng'){
    const title='FLIGHT TRIAL GO / NO-GO DECISION MATRIX',docNo='IF_YETI_TD0_FTR_SOP_002';
    pageHeader(doc,title,docNo);
    doc.autoTable({startY:62,margin:{left:40,right:40},theme:'grid',
      styles:{fontSize:8,cellPadding:4,lineColor:[220,220,220],lineWidth:0.5},
      body:GNG_HEADER.map(([k,l])=>[{content:l,styles:{fontStyle:'bold',fillColor:[245,246,248],cellWidth:110}},data[k]||'']),
      didDrawPage:()=>pageHeader(doc,title,docNo)});
    const rows=[];
    GNG.forEach(([cat,items])=>{
      items.forEach(([p,go,nogo,resp],idx)=>{
        const d=data['gng_'+cat+'_'+p]||{};
        const dec=d.decision||'';
        const row=idx===0?[{content:cat,rowSpan:items.length,styles:{valign:'middle',fontStyle:'bold',fillColor:[240,247,255],fontSize:7}}]:[];
        row.push(p,go,nogo,resp,
          {content:dec,styles:{fontStyle:'bold',halign:'center',textColor:dec==='GO'?[22,163,74]:dec==='NO-GO'?[220,38,38]:[150,150,150]}},
          d.name||'',{content:'',signature:d.sign||null});
        rows.push(row);
      });
    });
    doc.autoTable({startY:doc.lastAutoTable.finalY+10,margin:{top:64,left:40,right:40},
      head:[['Category','Parameter','GO Criteria','NO-GO Condition','Responsible','Decision','Name','Sign']],
      body:rows,theme:'grid',styles:{fontSize:6.8,cellPadding:3,lineColor:[210,210,210],lineWidth:0.5,valign:'middle'},
      headStyles:{fillColor:BRAND_GREEN,textColor:255,fontStyle:'bold',fontSize:7.5},
      columnStyles:{0:{cellWidth:58},1:{cellWidth:66},2:{cellWidth:68},3:{cellWidth:74},4:{cellWidth:76},5:{cellWidth:42},6:{cellWidth:52},7:{cellWidth:42}},
      didParseCell:d=>{if(d.section==='body'&&d.column.index===7&&d.cell.raw&&typeof d.cell.raw==='object')d.cell.text=[];},
      didDrawCell:d=>{
        if(d.section==='body'&&d.column.index===7){
          const raw=d.cell.raw;
          if(raw&&typeof raw==='object'&&raw.signature){
            doc.addImage(raw.signature,'PNG',d.cell.x+2,d.cell.y+2,d.cell.width-4,d.cell.height-4);
          }
        }
      },
      didDrawPage:()=>pageHeader(doc,title,docNo)});
    fname=`GoNoGo_${slug(data.uavId)}_${slug(data.flightDate)}.pdf`;
  }else{
    const title='DAILY AIRWORTHINESS CHECKLIST',docNo='IF_YETI_TD0_FTR_CKT_005';
    pageHeader(doc,title,docNo);
    doc.autoTable({startY:62,margin:{left:40,right:40},theme:'grid',
      styles:{fontSize:8,cellPadding:4,lineColor:[220,220,220],lineWidth:0.5},
      body:DLY_HEADER.map(([k,l])=>[{content:l,styles:{fontStyle:'bold',fillColor:[245,246,248],cellWidth:110}},data[k]||'']),
      didDrawPage:()=>pageHeader(doc,title,docNo)});
    const rows=[];
    DLY.forEach(([sec,items])=>{
      const filtered=items.filter(it=>!it.footer);
      if(!filtered.length)return;
      rows.push([{content:sec,colSpan:6,styles:{fillColor:BRAND_DARK,textColor:255,fontStyle:'bold',fontSize:7.5}}]);
      let i=0;
      while(i<filtered.length){
        const g=filtered[i].group;
        let runEnd=i;
        if(g){while(runEnd+1<filtered.length&&filtered[runEnd+1].group===g)runEnd++;}
        const runLen=runEnd-i+1;
        for(let j=i;j<=runEnd;j++){
          const it=filtered[j];const d=data['dly_'+it.sl]||{};
          let remarks=d.remarks||'';
          if(it.extra){
            const ex=it.extra.filter(x=>x[2]!=='sig').map(([k2,lbl])=>d[k2]?`${lbl}: ${d[k2]}`:null).filter(Boolean).join('; ');
            if(ex)remarks=ex+(remarks?' | '+remarks:'');
          }
          const row=[it.sl];
          if(j===i)row.push(g?{content:g,rowSpan:runLen,styles:{valign:'middle',fontStyle:'bold',fillColor:[245,246,248],fontSize:6.3}}:'');
          row.push(it.text,{content:'',checked:d.result==='pass'},{content:'',checked:d.result==='fail'},remarks);
          rows.push(row);
        }
        i=runEnd+1;
      }
    });
    doc.autoTable({startY:doc.lastAutoTable.finalY+10,margin:{top:64,left:40,right:40},
      head:[['#','Group','Checklist','Pass','Fail','Remarks']],
      body:rows,theme:'grid',styles:{fontSize:6.5,cellPadding:2.5,lineColor:[210,210,210],lineWidth:0.5,valign:'middle'},
      headStyles:{fillColor:BRAND_GREEN,textColor:255,fontStyle:'bold',fontSize:7.5},
      columnStyles:{0:{cellWidth:18,halign:'center'},1:{cellWidth:82},2:{cellWidth:230},3:{cellWidth:24,halign:'center'},4:{cellWidth:24,halign:'center'},5:{cellWidth:90}},
      didParseCell:d=>{if(d.section==='body'&&(d.column.index===3||d.column.index===4)&&d.cell.raw&&typeof d.cell.raw==='object')d.cell.text=[];},
      didDrawCell:d=>checklistBox(doc,d,{pass:3,fail:4}),
      didDrawPage:()=>pageHeader(doc,title,docNo)});
    let footY=doc.lastAutoTable.finalY+14;
    if(footY>740){doc.addPage();pageHeader(doc,title,docNo);footY=74;}
    const d84=data['dly_84']||{};
    doc.setDrawColor(210,210,210);doc.setLineWidth(0.6);
    doc.rect(40,footY,300,74);
    doc.rect(345,footY,170,74);
    doc.setFont(undefined,'bold');doc.setFontSize(8);doc.setTextColor(0,0,0);
    doc.text('Other Details / Remarks',46,footY+14);
    doc.text('Checker Signature',351,footY+14);
    doc.setFont(undefined,'normal');doc.setFontSize(7.5);
    doc.text(doc.splitTextToSize(d84.remarks||'—',288),46,footY+28);
    if(d84.checkerSig)doc.addImage(d84.checkerSig,'PNG',351,footY+20,150,46);
    const photos=(data['dly_85']&&data['dly_85'].photos)||[];
    if(photos.length){
      let py=footY+74+22;
      if(py>700){doc.addPage();pageHeader(doc,title,docNo);py=74;}
      doc.setFont(undefined,'bold');doc.setFontSize(10);doc.setTextColor(0,0,0);
      doc.text('Photos',40,py);
      py+=12;
      const cellW=165,cellH=125,gap=12,perRow=3;
      photos.forEach((src,i)=>{
        const col=i%perRow;
        if(col===0&&i>0)py+=cellH+gap;
        if(py+cellH>760){doc.addPage();pageHeader(doc,title,docNo);py=74;}
        const x=40+col*(cellW+gap);
        doc.setDrawColor(210,210,210);doc.setLineWidth(0.6);doc.rect(x,py,cellW,cellH);
        try{doc.addImage(src,'JPEG',x+3,py+3,cellW-6,cellH-6);}catch(e){}
      });
    }
    fname=`DailyAirworthiness_${slug(data.uavId)}_${slug(data.flightDate)}.pdf`;
  }
  return {blob:doc.output('blob'),fname};
}
async function generatePdf(){
  try{
    if(!currentPdfBlob)prepareCurrentPdf();
    const file=new File([currentPdfBlob],currentPdfName,{type:'application/pdf'});
    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({title:'YETI Checklist PDF',files:[file]});
      toast('PDF shared');
    }else{
      fallbackDownload(currentPdfBlob,currentPdfName);
    }
  }catch(e){
    if(e&&e.name==='AbortError')return;
    fallbackDownload(currentPdfBlob,currentPdfName);
  }
  saveDraft();
}

async function sharePdfToDrive(){
  try{
    if(!currentPdfBlob)prepareCurrentPdf();
    const file=new File([currentPdfBlob],currentPdfName,{type:'application/pdf'});

    if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({title:'YETI Checklist PDF',files:[file]});
      toast('Share sheet closed');
      saveDraft();
      return;
    }

    // Browser/device does not support sharing the PDF as a file.
    fallbackDownload(currentPdfBlob,currentPdfName);
    toast('PDF downloaded — open/share it with Drive');
    saveDraft();
  }catch(e){
    // User cancellation is normal and should not look like an error.
    if(e&&e.name==='AbortError')return;
    fallbackDownload(currentPdfBlob,currentPdfName);
    toast('PDF downloaded — open/share it with Drive');
  }
}

function fallbackDownload(blob,fname){
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

renderHome();
