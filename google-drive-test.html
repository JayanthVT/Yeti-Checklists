<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YETI Google Drive Test</title>
  <style>
    :root {
      --bg:#f4f5f7; --card:#fff; --text:#1a1d23; --sub:#6b7280;
      --line:#e3e5e9; --accent:#2563eb; --pass:#16a34a; --fail:#dc2626;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; padding:24px; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }
    .card {
      max-width:720px; margin:0 auto; padding:24px; background:var(--card);
      border:1px solid var(--line); border-radius:16px;
    }
    h1 { margin:0 0 8px; font-size:22px; }
    p { color:var(--sub); line-height:1.5; }
    code { background:#eef0f3; padding:2px 5px; border-radius:5px; }
    button {
      width:100%; padding:12px; border:0; border-radius:10px;
      font-size:14px; font-weight:600; cursor:pointer; margin-top:10px;
      background:var(--accent); color:#fff;
    }
    button.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
    button:disabled { opacity:.45; cursor:not-allowed; }
    #status {
      margin-top:18px; padding:14px; border-radius:10px; background:#f1f5f9;
      white-space:pre-wrap; word-break:break-word; font-size:13px;
    }
    #status.ok { color:var(--pass); }
    #status.error { color:var(--fail); }
    #files { margin-top:16px; line-height:1.7; }
    .small { font-size:12px; color:var(--sub); }
  </style>
</head>
<body>
  <div class="card">
    <h1>YETI — Google Drive Connection Test</h1>
    <p>
      Temporary test page for the YETI Checklists GitHub Pages app.
      This only tests Google authorization and Drive API access.
    </p>

    <p class="small">
      OAuth Client ID is already configured. No client secret is used here.
    </p>

    <button id="authorizeBtn" disabled>Connect to Google Drive</button>
    <button id="signoutBtn" class="secondary" disabled>Revoke test access</button>

    <div id="status">Loading Google libraries…</div>
    <ul id="files"></ul>
  </div>

  <script>
    const CLIENT_ID = '139525049648-k8d1n1ga4cndsj21fffhh9ppdqs47s8l.apps.googleusercontent.com';

    // Same scopes configured in Google Cloud.
    const SCOPES =
      "https://www.googleapis.com/auth/drive.file " +
      "https://www.googleapis.com/auth/drive.metadata.readonly";

    const DISCOVERY_DOC =
      "https://www.googleapis.com/discovery/v1/apis/drive/v3/rest";

    let gapiReady = false;
    let gisReady = false;
    let tokenClient = null;

    const authorizeBtn = document.getElementById("authorizeBtn");
    const signoutBtn = document.getElementById("signoutBtn");
    const statusEl = document.getElementById("status");
    const filesEl = document.getElementById("files");

    function setStatus(message, type="") {
      statusEl.textContent = message;
      statusEl.className = type;
    }

    function updateReady() {
      authorizeBtn.disabled = !(gapiReady && gisReady);
    }

    window.gapiLoaded = function() {
      gapi.load("client", async () => {
        try {
          await gapi.client.init({ discoveryDocs:[DISCOVERY_DOC] });
          gapiReady = true;
          setStatus(gisReady
            ? "Ready. Click Connect to Google Drive."
            : "Drive API loaded. Waiting for Google Identity Services…");
          updateReady();
        } catch (err) {
          setStatus("Drive API initialization failed:\n" + (err?.message || String(err)), "error");
        }
      });
    };

    window.gisLoaded = function() {
      gisReady = true;
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: ""
      });
      setStatus(gapiReady
        ? "Ready. Click Connect to Google Drive."
        : "Google Identity Services loaded. Waiting for Drive API…");
      updateReady();
    };

    authorizeBtn.addEventListener("click", () => {
      if (!tokenClient) {
        setStatus("Google authentication is not ready yet. Reload and try again.", "error");
        return;
      }

      tokenClient.callback = async (response) => {
        if (response.error) {
          setStatus(
            "Google authorization failed:\n" +
            JSON.stringify(response, null, 2),
            "error"
          );
          return;
        }

        signoutBtn.disabled = false;
        authorizeBtn.textContent = "Reconnect / Refresh access";
        setStatus("Authorization succeeded. Testing Drive API…");
        await listDriveFiles();
      };

      const existingToken = gapi.client.getToken();

      try {
        tokenClient.requestAccessToken({
          prompt: existingToken ? "" : "consent"
        });
      } catch (err) {
        setStatus("Could not start Google authorization:\n" + (err?.message || String(err)), "error");
      }
    });

    signoutBtn.addEventListener("click", () => {
      const token = gapi.client.getToken();
      if (!token) return;

      google.accounts.oauth2.revoke(token.access_token, () => {
        gapi.client.setToken("");
        filesEl.innerHTML = "";
        signoutBtn.disabled = true;
        authorizeBtn.textContent = "Connect to Google Drive";
        setStatus("Google access token revoked.");
      });
    });

    async function listDriveFiles() {
      filesEl.innerHTML = "";

      try {
        const response = await gapi.client.drive.files.list({
          pageSize: 20,
          fields: "files(id,name,mimeType,parents)"
        });

        const files = response.result.files || [];

        setStatus(
          "SUCCESS — Google authorization and Drive API access are working.\n" +
          "Files returned: " + files.length,
          "ok"
        );

        files.forEach(file => {
          const li = document.createElement("li");
          li.textContent = `${file.name} — ${file.mimeType}`;
          filesEl.appendChild(li);
        });
      } catch (err) {
        const message =
          err?.result?.error?.message ||
          err?.message ||
          JSON.stringify(err, null, 2);

        setStatus(
          "Authorization may have succeeded, but the Drive API request failed:\n" +
          message,
          "error"
        );
      }
    }
  </script>

  <script async defer
    src="https://apis.google.com/js/api.js"
    onload="gapiLoaded()"></script>

  <script async defer
    src="https://accounts.google.com/gsi/client"
    onload="gisLoaded()"></script>
</body>
</html>
